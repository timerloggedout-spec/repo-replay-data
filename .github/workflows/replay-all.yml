name: replay-all
on: workflow_dispatch
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout engine (repo-replay, public)
        uses: actions/checkout@v4
        with:
          repository: timerloggedout-spec/repo-replay
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decrypt harvest splice (key = repo secret)
        env:
          KEY: ${{ secrets.REPO_REPLAY_HARVEST_KEY }}
        run: |
          cat sensitive/harvest.tar.gpg.part-* > /tmp/h.gpg
          printf '%s' "$KEY" > /tmp/k
          mkdir -p corpus && gpg --batch --quiet --passphrase-file /tmp/k -d /tmp/h.gpg | tar -xf - -C corpus
          rm -f /tmp/k /tmp/h.gpg
          ls corpus/harvest/session_store | head -3
      - name: Master tree snapshot (public repo, blobless)
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/timerloggedout-spec/termux-monorepo /tmp/mono
          git -C /tmp/mono ls-tree -r --name-only HEAD > tree.txt
          wc -l tree.txt
      - name: Unpack V2 snapshot pack (hash-verified)
        run: |
          if [ -f v2-snapshot/MANIFEST.json ]; then
            cat v2-snapshot/part-* > /tmp/v2.tar.gz
            python3 -c "import json,hashlib; m=json.load(open('v2-snapshot/MANIFEST.json')); h=hashlib.sha256(open('/tmp/v2.tar.gz','rb').read()).hexdigest(); assert h==m['tar_sha256'], 'TAR SHA MISMATCH'; print('pack sha OK', m['head_sha'], m['files'])"
            mkdir -p /tmp/v2 && tar -xzf /tmp/v2.tar.gz -C /tmp/v2
          fi
          ls /tmp/v2 2>/dev/null | head -3 || true
      - name: GitLab V2 snapshot clone (fail-soft, only if no pack)
        continue-on-error: true
        run: |
          if [ ! -d /tmp/v2 ]; then
            timeout 240 git clone --depth 1 https://gitlab.com/a-group2180532/termux-monorepo /tmp/v2 || echo "V2_CLONE_FAILED"
          fi
          ls /tmp/v2 2>/dev/null | head -3 || true
      - name: Full-census replay (assistant-only)
        run: |
          if [ -d /tmp/v2 ]; then
            python3 engine/revwright/remote_run.py corpus/harvest/session_store db/stage_scores_assistant.db 0 tree.txt /tmp/v2 gapfill
          else
            python3 engine/revwright/remote_run.py corpus/harvest/session_store db/stage_scores_assistant.db 0 tree.txt
          fi
          cp remote_summary.json summary.json
      - name: Commit results back
        run: |
          git config user.name "repo-replay-actions"
          git config user.email "actions@users.noreply.github.com"
          git add db/stage_scores_assistant.db summary.json gapfill
          git commit -m "remote replay-all: full census (assistant-only) [skip ci]" || echo "no changes"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: remote-summary
          path: summary.json
